[package]
name = "anchormap"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Lock-free concurrent hash map: elements never move after insertion, enabling lock-free reads"
repository = "https://github.com/mcrepeau/anchormap"
authors = ["Matthieu Crepeau"]
readme = "README.md"
keywords = ["concurrent", "lock-free", "hashmap", "anchormap", "no-reorder"]
categories = ["algorithms", "data-structures", "concurrency"]


[features]
serde = ["dep:serde"]

[dependencies]
ahash = "0.8"
serde = { version = "1", features = ["derive"], optional = true }

# parking_lot is the production lock implementation. It is gated off under
# cfg(miri) (parking_lot's libc futex call is rejected by recent Miri
# nightlies; src/miri_sync.rs substitutes std::sync::Mutex) and under
# cfg(loom) (src/loom_tests.rs models the locks with loom::sync::Mutex).
[target.'cfg(not(any(miri, loom)))'.dependencies]
parking_lot = "0.12"

[dev-dependencies]
criterion = "0.8.2"
dashmap = "6"
papaya = "0.2"
serde_json = "1"

# Loom verification build (`RUSTFLAGS="--cfg loom" cargo test --lib loom_tests`):
# never enabled in normal builds or for downstream users.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[[bench]]
name = "anchormap_benchmarks"
harness = false

[[bench]]
name = "comparison_benchmarks"
harness = false

[profile.release]
opt-level = 3          # Maximum optimizations
codegen-units = 1      # Better optimizations (slower compile)
lto = true             # Link-time optimizations
panic = "abort"        # Smaller binaries